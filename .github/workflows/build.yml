name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build with Buildozer
        uses: kivy/buildozer@v2.0.0
        with:
          buildozer-version: '1.5.0'
          requirements: python3,pygame
          orientation: landscape
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dinozavrik-apk
          path: bin/*.apk
